<svg xmlns="http://www.w3.org/2000/svg" width="753" height="214"
     viewBox="0 0 753 214" role="img"
     aria-label="L4RP - arch linux tooling, python, opsec enabled">
<title>L4RP</title>
<defs>
<pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse">
  <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
</pattern>
<radialGradient id="vig" cx="50%" cy="34%" r="78%">
  <stop offset="0%" stop-color="#1b1b21"/>
  <stop offset="100%" stop-color="#050506"/>
</radialGradient>
<filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
  <feDropShadow dx="0" dy="5" stdDeviation="10"
                flood-color="#000000" flood-opacity="0.85"/>
</filter>
<linearGradient id="sweepg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
  <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.5"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<clipPath id="heroclip">
  <rect width="753" height="214" rx="12"/>
</clipPath>
</defs>
<style>
  text{font-family:ui-monospace,'DejaVu Sans Mono','Liberation Mono','Courier New',monospace}
  .mark rect{fill:#f4f4f6}
  .tag{fill:#8e8e96;font-size:14px;letter-spacing:2px}
  .rule{stroke:#33333a}
  .cur{fill:#f4f4f6}
  /* Der Schriftzug baut sich spaltenweise auf, danach faehrt einmal ein
     Lichtstreifen darueber. Beides laeuft genau einmal. */
  .mark{clip-path:inset(0 100% 0 0);animation:reveal 1.5s steps(23) 0.3s 1 forwards}
  @keyframes reveal{to{clip-path:inset(0 0 0 0)}}
  .tag{opacity:0;animation:fade 0.6s linear 2.0s 1 forwards}
  @keyframes fade{to{opacity:1}}
  .sweep{opacity:0;animation:sweep 1.4s linear 2.1s 1 forwards}
  @keyframes sweep{
    0%{opacity:0;transform:translateX(-240px)}
    20%{opacity:1}
    80%{opacity:1}
    100%{opacity:0;transform:translateX(753px)}
  }
  .blink{animation:bl 1.06s steps(1) infinite}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    .mark{clip-path:none!important}
    .tag{opacity:1!important}
    .sweep{opacity:0!important}
  }
</style>
<rect width="753" height="214" rx="12" fill="url(#vig)"/>
<rect width="753" height="214" rx="12" fill="url(#grid)"/>

<text class="ttl" x="314.0" y="22" text-anchor="middle">l4rp@github: ~/systemd</text>
<g class="ap0">
<text class="dim" x="26.0" y="56.0" textLength="135.0" lengthAdjust="spacing">user@github:~$ </text>
<g clip-path="url(#clip0)"><text class="cmd" x="161.0" y="56.0" textLength="243.0" lengthAdjust="spacing">systemctl status motivation</text></g>

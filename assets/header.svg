</pattern>
<clipPath id="clip0"><rect class="tp0" x="161.0" y="41.0" width="54.0" height="24.0"/></clipPath>
<clipPath id="clip1"><rect class="tp1" x="161.0" y="89.0" width="162.0" height="24.0"/></clipPath>

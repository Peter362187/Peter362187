  </g>
  <line x1="1" y1="36.0" x2="712" y2="36.0" stroke="#2b2b32"/>
  <rect x="20" y="15" width="7" height="7" fill="none" stroke="#4a4a4a" stroke-width="1"/><rect x="36" y="15" width="7" height="7" fill="none" stroke="#4a4a4a" stroke-width="1"/><rect x="52" y="15" width="7" height="7" fill="none" stroke="#4a4a4a" stroke-width="1"/>
  <text class="ttl" x="356.5" y="23" text-anchor="middle">l4rp@github: ~</text>
<g class="ap0">
<text class="dim" x="30.0" y="60.0" textLength="153.0" lengthAdjust="spacing">user@github:~$ </text>
<g clip-path="url(#clip0)"><text class="cmd" x="183.0" y="60.0" textLength="61.2" lengthAdjust="spacing">whoami</text></g>
<g class="cw0 cur"><g class="cm0"><rect class="blink" x="183.0" y="45.0" width="10.2" height="17.0"/></g></g>
</g>
<text class="out o0_0" x="30.0" y="84.7" textLength="40.8" lengthAdjust="spacing">L4RP</text>
<g class="ap1">
<text class="dim" x="30.0" y="109.3" textLength="153.0" lengthAdjust="spacing">user@github:~$ </text>
<g clip-path="url(#clip1)"><text class="cmd" x="183.0" y="109.3" textLength="183.6" lengthAdjust="spacing">sudo install opsec</text></g>
<g class="cw1 cur"><g class="cm1"><rect class="blink" x="183.0" y="94.3" width="10.2" height="17.0"/></g></g>
</g>
<text class="out o1_0" x="30.0" y="133.9" textLength="346.8" lengthAdjust="spacing">[sudo] password for l4rp: ********</text>
<text class="out o1_1" x="30.0" y="158.6" textLength="295.8" lengthAdjust="spacing">Reading package lists... done</text>
<text class="out o1_2" x="30.0" y="183.2" textLength="275.4" lengthAdjust="spacing">Unpacking opsec (4.0.1) ...</text>
<text class="out o1_3" x="30.0" y="207.9" textLength="295.8" lengthAdjust="spacing">OPSEC installed successfully.</text>
<g class="ap2">
<text class="dim" x="30.0" y="232.5" textLength="153.0" lengthAdjust="spacing">user@github:~$ </text>
<g clip-path="url(#clip2)"><text class="cmd" x="183.0" y="232.5" textLength="112.2" lengthAdjust="spacing">./status.sh</text></g>
<g class="cw2 cur"><g class="cm2"><rect class="blink" x="183.0" y="217.5" width="10.2" height="17.0"/></g></g>
</g>
<text class="out o2_0" x="30.0" y="257.2" textLength="224.4" lengthAdjust="spacing">SYSTEM STATUS : ONLINE</text>
<text class="out o2_1" x="30.0" y="281.9" textLength="234.6" lengthAdjust="spacing">OPSEC         : ENABLED</text>
<text class="out o2_2" x="30.0" y="306.5" textLength="214.2" lengthAdjust="spacing">GIT           : CLEAN</text>
<text class="out o2_3" x="30.0" y="331.1" textLength="255.0" lengthAdjust="spacing">SHELL         : /bin/bash</text>
<text class="out o2_4" x="30.0" y="355.8" textLength="255.0" lengthAdjust="spacing">LOCATION      : localhost</text>
<g class="fin">
<text class="dim" x="30.0" y="380.4" textLength="153.0" lengthAdjust="spacing">user@github:~$ </text>
<rect class="blink" x="183.0" y="365.4" width="10.2" height="17.0"/>
</g>
  <rect x="0.5" y="0.5" width="712" height="426" rx="8"
        fill="none" stroke="#33333a"/>
</g>
</svg>

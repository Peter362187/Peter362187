<text class="ttl" x="314.0" y="22" text-anchor="middle">l4rp@github: ~</text>
<g class="ap0">
<text class="dim" x="26.0" y="56.0" textLength="135.0" lengthAdjust="spacing">user@github:~$ </text>
<g clip-path="url(#clip0)"><text class="cmd" x="161.0" y="56.0" textLength="54.0" lengthAdjust="spacing">whoami</text></g>
<g class="cw0 cur"><g class="cm0"><rect class="blink" x="161.0" y="43.0" width="9.0" height="15.0"/></g></g>
</g>

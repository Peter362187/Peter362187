<rect width="753" height="467" rx="12" fill="url(#vig)"/>
<rect width="753" height="467" rx="12" fill="url(#grid)"/>
<g transform="translate(20,20)">
  <rect width="713" height="427" rx="8" fill="#000000" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect width="713" height="36.0" fill="#0e0e12"/>
    <rect y="36.0" width="713" height="391.0"

  @keyframes cw2{0%,56.970%{opacity:0}56.981%,67.493%{opacity:1}67.504%,100%{opacity:0}}
  .cw2{opacity:0;animation:cw2 9.08s linear 1 forwards}
  @keyframes cm2{0%,56.970%{transform:translateX(0)}63.636%,100%{transform:translateX(112.2px)}}
  .cm2{animation:cm2 9.08s steps(11) 1 forwards}
  @keyframes o2_0{0%,67.493%{opacity:0}67.504%,100%{opacity:1}}
  .o2_0{opacity:0;animation:o2_0 9.08s linear 1 forwards}
  @keyframes o2_1{0%,68.705%{opacity:0}68.716%,100%{opacity:1}}
  .o2_1{opacity:0;animation:o2_1 9.08s linear 1 forwards}
  @keyframes o2_2{0%,69.917%{opacity:0}69.928%,100%{opacity:1}}
  .o2_2{opacity:0;animation:o2_2 9.08s linear 1 forwards}
  @keyframes o2_3{0%,71.129%{opacity:0}71.140%,100%{opacity:1}}
  .o2_3{opacity:0;animation:o2_3 9.08s linear 1 forwards}
  @keyframes o2_4{0%,72.342%{opacity:0}72.353%,100%{opacity:1}}
  .o2_4{opacity:0;animation:o2_4 9.08s linear 1 forwards}
  @keyframes fin{0%,88.981%{opacity:0}88.992%,100%{opacity:1}}

  @keyframes tp1{0%,26.336%{transform:translateX(-183.6px)}37.245%,100%{transform:translateX(0)}}
  .tp1{animation:tp1 9.08s steps(18) 1 forwards}
  @keyframes cw1{0%,26.336%{opacity:0}26.347%,41.102%{opacity:1}41.113%,100%{opacity:0}}
  .cw1{opacity:0;animation:cw1 9.08s linear 1 forwards}
  @keyframes cm1{0%,26.336%{transform:translateX(0)}37.245%,100%{transform:translateX(183.6px)}}
  .cm1{animation:cm1 9.08s steps(18) 1 forwards}
  @keyframes o1_0{0%,41.102%{opacity:0}41.113%,100%{opacity:1}}
  .o1_0{opacity:0;animation:o1_0 9.08s linear 1 forwards}
  @keyframes o1_1{0%,42.314%{opacity:0}42.325%,100%{opacity:1}}
  .o1_1{opacity:0;animation:o1_1 9.08s linear 1 forwards}
  @keyframes o1_2{0%,43.526%{opacity:0}43.537%,100%{opacity:1}}
  .o1_2{opacity:0;animation:o1_2 9.08s linear 1 forwards}
  @keyframes o1_3{0%,44.738%{opacity:0}44.749%,100%{opacity:1}}
  .o1_3{opacity:0;animation:o1_3 9.08s linear 1 forwards}
  @keyframes ap2{0%,56.970%{opacity:0}56.981%,100%{opacity:1}}

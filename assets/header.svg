</g>
<text class="out o2_0" x="26.0" y="248.0" textLength="198.0" lengthAdjust="spacing">SYSTEM STATUS : ONLINE</text>
<text class="out o2_1" x="26.0" y="272.0" textLength="207.0" lengthAdjust="spacing">OPSEC         : ENABLED</text>
<text class="out o2_2" x="26.0" y="296.0" textLength="189.0" lengthAdjust="spacing">GIT           : CLEAN</text>
<text class="out o2_3" x="26.0" y="320.0" textLength="225.0" lengthAdjust="spacing">SHELL         : /bin/bash</text>
<text class="out o2_4" x="26.0" y="344.0" textLength="225.0" lengthAdjust="spacing">LOCATION      : localhost</text>

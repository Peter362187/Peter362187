<svg xmlns="http://www.w3.org/2000/svg" width="753" height="467"
     viewBox="0 0 753 467" role="img"
     aria-label="l4rp@github: ~ - animiertes Terminal">
<title>l4rp@github: ~</title>
<defs>
<pattern id="scan" width="1" height="3" patternUnits="userSpaceOnUse">
  <rect width="1" height="1" fill="#ffffff" opacity="0.045"/>
</pattern>
<pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse">
  <circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.07"/>
</pattern>
<radialGradient id="vig" cx="50%" cy="34%" r="78%">
  <stop offset="0%" stop-color="#1b1b21"/>
  <stop offset="100%" stop-color="#050506"/>
</radialGradient>
<filter id="shadow" x="-12%" y="-12%" width="124%" height="124%">
  <feDropShadow dx="0" dy="5" stdDeviation="10"
                flood-color="#000000" flood-opacity="0.85"/>
</filter>
<clipPath id="win">
  <rect width="713" height="427" rx="8"/>
</clipPath>
<clipPath id="clip0"><rect class="tp0" x="183.0" y="43.0" width="61.2" height="24.6"/></clipPath>
<clipPath id="clip1"><rect class="tp1" x="183.0" y="92.3" width="183.6" height="24.6"/></clipPath>
<clipPath id="clip2"><rect class="tp2" x="183.0" y="215.5" width="112.2" height="24.6"/></clipPath>
</defs>
<style>

    dominant-baseline:auto;white-space:pre}
  .cmd{fill:#f2f2f2}
  .out{fill:#a8a8a8}
  .dim{fill:#6f6f6f}
  .ttl{fill:#7a7a7a;font-size:13px;letter-spacing:1px}
  .blink{fill:#f2f2f2;animation:bl 1.06s steps(1) infinite}
  @keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important}
    g,text{opacity:1!important}
    .cur{opacity:0!important}
  }
  @keyframes ap0{0%,7.713%{opacity:0}7.725%,100%{opacity:1}}
  .ap0{opacity:0;animation:ap0 9.08s linear 1 forwards}
  @keyframes tp0{0%,7.713%{transform:translateX(-61.2px)}11.350%,100%{transform:translateX(0)}}
  .tp0{animation:tp0 9.08s steps(6) 1 forwards}
  @keyframes cw0{0%,7.713%{opacity:0}7.725%,15.207%{opacity:1}15.218%,100%{opacity:0}}
  .cw0{opacity:0;animation:cw0 9.08s linear 1 forwards}
  @keyframes cm0{0%,7.713%{transform:translateX(0)}11.350%,100%{transform:translateX(61.2px)}}
